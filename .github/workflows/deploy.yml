# main 에 올라가면 이미지를 만들어 GHCR 에 올리고, 테스트 서버에서 갈아끼운다.
#
# 필요한 저장소 시크릿 (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST        141.164.60.58
#   DEPLOY_USER        서버 접속 계정 (예: root 또는 deploy)
#   DEPLOY_SSH_KEY     그 계정으로 접속되는 개인키 전문
#   NAVER_MAP_CLIENT_ID  네이버 Maps Client ID (프론트 빌드에 박힌다)
#   SITE_URL           https://atb.co.kr
#
# GHCR 로그인은 GITHUB_TOKEN 으로 되므로 따로 만들 필요가 없다.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # 버튼으로도 돌릴 수 있게

env:
  REGISTRY: ghcr.io
  BACK_IMAGE: ghcr.io/${{ github.repository_owner }}/atb-back
  FRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/atb-front

jobs:
  # 배포 전에 깨진 코드를 걸러낸다. 여기서 실패하면 이미지도 만들지 않는다.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 백엔드 타입 검사
        working-directory: atb-back
        run: |
          npm ci
          npx tsc --noEmit
      - name: 프론트 타입 검사 · 린트
        working-directory: atb-front
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint src

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR 에 올리려면 필요
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 백엔드 이미지
        uses: docker/build-push-action@v6
        with:
          context: atb-back
          push: true
          tags: |
            ${{ env.BACK_IMAGE }}:latest
            ${{ env.BACK_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 프론트 이미지
        uses: docker/build-push-action@v6
        with:
          context: atb-front
          push: true
          # NEXT_PUBLIC_* 는 빌드 때 코드에 박히므로 여기서 넣어야 한다
          build-args: |
            NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${{ secrets.NAVER_MAP_CLIENT_ID }}
            SITE_URL=${{ secrets.SITE_URL }}
          tags: |
            ${{ env.FRONT_IMAGE }}:latest
            ${{ env.FRONT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 서버에서 이미지 교체
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/atb
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f

            # 뜰 때까지 기다린다. 컨테이너가 죽었으면 더 기다려도 소용없으므로
            # 실패하면 상태와 로그를 찍고 끝낸다 — 이게 없으면 '연결 실패' 만 보이고
            # 무엇 때문에 죽었는지 알 수 없다.
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4030/api/health > /dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done

            if [ "$ok" != "1" ]; then
              echo "===== 컨테이너 상태 ====="
              docker compose ps -a
              echo "===== 백엔드 로그 ====="
              docker compose logs --tail=80 back || true
              echo "===== 프론트 로그 ====="
              docker compose logs --tail=80 front || true
              exit 1
            fi

            curl -fsS http://127.0.0.1:4030/api/health
            curl -fsS -o /dev/null -w "front %{http_code}" http://127.0.0.1:4000/ || {
              echo "===== 프론트 로그 ====="
              docker compose logs --tail=80 front
              exit 1
            }
