# main 에 올라가면 이미지를 만들어 GHCR 에 올리고, 테스트 서버에서 갈아끼운다.
#
# 필요한 저장소 시크릿 (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST        141.164.60.58
#   DEPLOY_USER        서버 접속 계정 (예: root 또는 deploy)
#   DEPLOY_SSH_KEY     그 계정으로 접속되는 개인키 전문
#   NAVER_MAP_CLIENT_ID  네이버 Maps Client ID (프론트 빌드에 박힌다)
#   SITE_URL           https://atb.co.kr
#
# GHCR 로그인은 GITHUB_TOKEN 으로 되므로 따로 만들 필요가 없다.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # 버튼으로도 돌릴 수 있게

env:
  REGISTRY: ghcr.io
  BACK_IMAGE: ghcr.io/${{ github.repository_owner }}/atb-back
  FRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/atb-front

jobs:
  # 배포 전에 깨진 코드를 걸러낸다. 여기서 실패하면 이미지도 만들지 않는다.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 백엔드 타입 검사
        working-directory: atb-back
        run: |
          npm ci
          npx tsc --noEmit
      - name: 프론트 타입 검사 · 린트
        working-directory: atb-front
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint src

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR 에 올리려면 필요
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 백엔드 이미지
        uses: docker/build-push-action@v6
        with:
          context: atb-back
          push: true
          tags: |
            ${{ env.BACK_IMAGE }}:latest
            ${{ env.BACK_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 빌드에 들어갈 값 확인
        env:
          MAP_KEY: ${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID || secrets.NAVER_MAP_CLIENT_ID }}
          SITE: ${{ secrets.SITE_URL }}
        run: |
          # 이 둘은 빌드 시점에 코드로 박힌다. 비어 있으면 배포는 되는데 지도가
          # 통째로 죽고(키 없음), 사이트맵 주소가 localhost 로 나간다.
          # 나중에 화면에서 발견하느니 여기서 멈추는 편이 낫다.
          [ -n "$MAP_KEY" ] || { echo "::error::지도 키 시크릿이 비어 있습니다 (NEXT_PUBLIC_NAVER_MAP_CLIENT_ID 또는 NAVER_MAP_CLIENT_ID)"; exit 1; }
          [ -n "$SITE" ]    || { echo "::error::SITE_URL 시크릿이 비어 있습니다"; exit 1; }
          echo "지도 키 ${#MAP_KEY}자 · SITE_URL=$SITE"

      - name: 프론트 이미지
        uses: docker/build-push-action@v6
        with:
          context: atb-front
          push: true
          # NEXT_PUBLIC_* 는 빌드 때 코드에 박히므로 여기서 넣어야 한다
          build-args: |
            NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID || secrets.NAVER_MAP_CLIENT_ID }}
            SITE_URL=${{ secrets.SITE_URL }}
            API_BASE_URL=http://back:4030
          tags: |
            ${{ env.FRONT_IMAGE }}:latest
            ${{ env.FRONT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 서버에서 이미지 교체
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/atb
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f

            # 뜰 때까지 기다린다. 컨테이너가 죽었으면 더 기다려도 소용없으므로
            # 실패하면 상태와 로그를 찍고 끝낸다 — 이게 없으면 '연결 실패' 만 보이고
            # 무엇 때문에 죽었는지 알 수 없다.
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4030/api/health > /dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done

            if [ "$ok" != "1" ]; then
              echo "===== 컨테이너 상태 ====="
              docker compose ps -a
              echo "===== 백엔드 로그 ====="
              docker compose logs --tail=80 back || true
              echo "===== 프론트 로그 ====="
              docker compose logs --tail=80 front || true
              exit 1
            fi

            curl -fsS http://127.0.0.1:4030/api/health

            # 화면에 데이터가 실제로 박혀 나오는지 본다.
            # 200 만 확인하면 '껍데기만 뜬 빈 화면' 을 정상으로 착각한다 —
            # 파라미터 없는 페이지를 Next 가 빌드 시점에 미리 렌더해 버리면
            # (그때는 백엔드가 없으니) 숫자가 빠진 채로 배포된다.
            for page in "/" "/presale" "/apt"; do
              body=$(curl -fsS "http://127.0.0.1:4000$page") || {
                echo "::error::$page 응답 실패"
                docker compose logs --tail=60 front
                exit 1
              }
              if ! echo "$body" | grep -qE '[0-9]{1,3},[0-9]{3}'; then
                echo "::error::$page 에 숫자 데이터가 없습니다 (빈 화면으로 배포됐을 가능성)"
                exit 1
              fi
              echo "$page 정상"
            done
