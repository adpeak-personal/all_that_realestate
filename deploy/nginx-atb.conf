# /etc/nginx/sites-available/atb  (테스트 서버)
#
# certbot 이 443 블록과 인증서 경로를 알아서 추가한다.
# 먼저 이 파일(80 포트)만 두고 certbot 을 돌리면 된다.

server {
    listen 80;
    listen [::]:80;
    server_name atb.co.kr www.atb.co.kr;

    # 업로드는 없지만 폼 전송이 잘리지 않게 여유를 둔다
    client_max_body_size 2m;

    # 프록시 뒤에 있다는 사실을 앱에 알려준다.
    # 이게 없으면 접속자 IP 가 전부 서버 자신으로 찍힌다.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API 는 백엔드로 직접 보낸다. 프론트를 한 번 더 거칠 이유가 없다.
    location /api/ {
        proxy_pass http://127.0.0.1:4030;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
